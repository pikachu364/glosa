# Builds everything and runs the tests on Windows, macOS and Linux.
name: CI

on:
  push:
  pull_request:

# A newer push to the same branch makes the run for the older one pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  AVALONIA_TELEMETRY_OPTOUT: 1

jobs:
  time-window:
    runs-on: ubuntu-latest
    outputs:
      run_macos: ${{ steps.window.outputs.run_macos }}
    steps:
      - name: Check Japan time
        id: window
        run: |
          hour=$(TZ=Asia/Tokyo date +%H)
          if [ "$hour" -ge 9 ] && [ "$hour" -lt 20 ]; then
            echo "run_macos=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_macos=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: time-window
    if: ${{ needs.time-window.outputs.run_macos == 'true' || matrix.os != 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build Glosa.slnx -c Release
      - run: dotnet test tests/Glosa.Tests/Glosa.Tests.csproj -c Release --no-build
