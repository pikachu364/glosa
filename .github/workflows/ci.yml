# Builds everything and runs the tests on Windows, macOS and Linux.
name: CI

on:
  # Push CI is reserved for main; PR branches are tested by pull_request below.
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:


permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  AVALONIA_TELEMETRY_OPTOUT: 1

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build Glosa.slnx -c Release
      - run: dotnet test tests/Glosa.Tests/Glosa.Tests.csproj -c Release --no-build
