version: 2
updates:
  # .NET / NuGet dependencies: keep version updates in one pull request
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    groups:
      all-nuget-updates:
        patterns:
          - "*"

  # GitHub Actions used by workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    groups:
      all-github-actions-updates:
        patterns:
          - "*"
